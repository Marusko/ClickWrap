# Build this app's installer with:
#   pwsh ./build/publish-installers.ps1 -App time-maker
# Produces out/time-maker/TimeMakerSetup.exe -- the single file you distribute.

appId: time-maker
displayName: Time Maker

# TODO: replace with the deployed server address before building installers.
# Must match CLICKWRAP_PUBLIC_BASE_URL on the server, or downloads will 404.
serverUrl: https://clickwrap.public.domain

# Permanent. ClickOnce refuses to update an app from a folder other than the one it was
# installed from, so changing this after the app has shipped breaks updates for everyone.
installFolder: '%LOCALAPPDATA%\ClickWrap\time-maker'

# Existing installs are registered against C:\Users\<user>\Downloads\Time Maker\.
# "adopt" keeps updating them there instead of failing; fresh installs use installFolder.
onExistingInstall: adopt

# Time Maker creates %LOCALAPPDATA%\TimeMaker itself on first run (App.xaml.cs), and that
# folder is outside anything ClickOnce owns, so it survives uninstall. Nothing to prepare.
preInstall: []
