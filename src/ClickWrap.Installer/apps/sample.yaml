# One file per app. Build that app's installer with:
#   pwsh ./build/publish-installers.ps1 -App sample
#
# Or directly. Note InstallerAssemblyName, not AssemblyName: the latter is a global MSBuild
# property and would also rename the referenced UpdateClient project, breaking restore.
#   dotnet publish src/ClickWrap.Installer -p:ClickWrapApp=sample -p:InstallerAssemblyName=SampleSetup
#
# Exactly one of these is embedded into each exe, so shipping an app means shipping one exe.

appId: sample
displayName: Sample App
serverUrl: https://updates.example.com

# The folder the publish output is always extracted into, before setup.exe runs.
# ClickOnce refuses to update an app from a folder other than the one it was installed from,
# so once an app has shipped, this must never change. Environment variables expand.
installFolder: '%LOCALAPPDATA%\ClickWrap\sample'

# What to do if the app is already installed from some other folder:
#   adopt     - update it where it is (default; no prompts, keeps the app's ClickOnce data)
#   reinstall - open the ClickOnce uninstall dialog so it can be moved to installFolder
onExistingInstall: adopt

# Optional. Runs before setup.exe.
preInstall: []
#preInstall:
#  - type: createFolder
#    path: '%LOCALAPPDATA%\SampleApp\data'
#  - type: downloadFile
#    url: https://updates.example.com/extras/seed.db
#    path: '%LOCALAPPDATA%\SampleApp\data\seed.db'
#    overwrite: false

# Optional. What the uninstaller (update.exe --uninstall) removes besides the app itself.
# ClickOnce's own uninstall, the install folder and HKCU\Software\ClickWrap\{appId} always go;
# this lists what the app itself leaves behind. Omit it when the app keeps no data.
#uninstall:
#  # Folders or files: settings, logs, databases. Full paths; environment variables expand.
#  data:
#    - '%LOCALAPPDATA%\SampleApp'
#    - '%APPDATA%\SampleApp\logs'
#  # The app's own keys under HKCU\Software.
#  registryKeys:
#    - 'HKCU\Software\SampleApp'
#  # Whether "Also delete its settings, logs and other data" starts ticked. Default false.
#  deleteData: false
#  # Show that checkbox. When false, deleteData decides without asking. Default true.
#  askAboutData: true
